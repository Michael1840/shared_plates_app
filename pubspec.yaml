name: shared_plates_app
description: SharedPlates - share recipes with friends.
publish_to: "none"

version: 1.0.0+100

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  bloc: ^9.2.1
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.4.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sign_in_with_apple: ^8.2.0
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/paprika/
    - assets/covers/
    - assets/brand/

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Caveat-Bold.ttf
          weight: 700
