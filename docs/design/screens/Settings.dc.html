<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C4421D}a:hover{color:#8F2E12}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font:inherit;cursor:pointer}
/* SharedPlates motion: one curve family, short durations */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.55,0,1,.45);--ease-back:cubic-bezier(.34,1.56,.64,1);--t-press:120ms;--t-small:200ms;--t-med:300ms;--t-large:450ms}
@keyframes m-rise{from{opacity:0;translate:0 14px}}
@keyframes m-print{from{opacity:0;translate:0 22px;rotate:-5deg}}
@keyframes m-pap{from{opacity:0;scale:.6;translate:0 14px}}
@keyframes m-note{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -6% -20% 0)}}
@keyframes m-stamp{from{opacity:0;scale:1.7}}
@keyframes m-sheet{from{translate:0 100%}}
@keyframes m-fade{from{opacity:0}}
@keyframes m-bump{35%{scale:1.3;color:#C4421D}}
@keyframes m-bump2{35%{scale:1.3;color:#C4421D}}
@keyframes m-flash{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-flash2{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes m-next{from{opacity:0;translate:32px 0}}
@keyframes m-next2{from{opacity:0;translate:32px 0}}
@keyframes m-back{from{opacity:0;translate:-32px 0}}
@keyframes m-back2{from{opacity:0;translate:-32px 0}}
.m-rise{animation:m-rise var(--t-large) var(--ease-out) backwards;animation-delay:var(--d,0ms)}
.m-print{animation:m-print 520ms var(--ease-out) backwards;animation-delay:var(--d,140ms);transition:translate var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),scale var(--t-press) var(--ease-out)}
a.m-print:hover,.m-lift:hover .m-print{translate:0 -4px;box-shadow:0 16px 30px rgba(60,35,20,.22)!important}
.m-pap{animation:m-pap 560ms var(--ease-back) backwards;animation-delay:var(--d,240ms)}
.m-note{animation:m-note 640ms var(--ease-out) backwards;animation-delay:var(--d,420ms)}
.m-stamp{animation:m-stamp 360ms var(--ease-back) backwards;animation-delay:var(--d,640ms)}
.m-sheet{animation:m-sheet var(--t-large) var(--ease-out) backwards;animation-delay:80ms}
.m-scrim{animation:m-fade var(--t-med) var(--ease-out) backwards}
.m-print:nth-child(1){--d:160ms}.m-print:nth-child(2){--d:230ms}.m-print:nth-child(3){--d:300ms}.m-print:nth-child(4){--d:370ms}.m-print:nth-child(5){--d:440ms}.m-print:nth-child(6){--d:510ms}
.m-tile:nth-child(1){--d:180ms}.m-tile:nth-child(2){--d:230ms}.m-tile:nth-child(3){--d:280ms}.m-tile:nth-child(4){--d:330ms}
.m-row:nth-child(1){--d:260ms}.m-row:nth-child(2){--d:310ms}.m-row:nth-child(3){--d:360ms}.m-row:nth-child(4){--d:410ms}.m-row:nth-child(5){--d:460ms}.m-row:nth-child(n+6){--d:500ms}
.m-tile img{transition:rotate var(--t-med) var(--ease-back),scale var(--t-med) var(--ease-back)}
.m-tile:hover img{rotate:12deg;scale:1.06}
button,a,label{transition:scale var(--t-press) var(--ease-out),background-color var(--t-small) var(--ease-out),color var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),border-color var(--t-small) var(--ease-out)}
button:active,a:active{scale:.97}
label:focus-within{box-shadow:0 0 0 3px rgba(233,162,59,.7),0 6px 16px rgba(80,25,8,.18)!important}
:focus-visible{outline:3px solid #E9A23B;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
/* end motion */
</style>
</helmet>
<div style="width: 390px; height: 1720px; box-sizing: border-box; background-color: #F6F1EA; background-image: radial-gradient(#E4D8CB 1.1px, transparent 1.3px); background-size: 20px 20px; font-family: Inter, system-ui, sans-serif; color: #241C17; display: flex; flex-direction: column; padding: 0 20px 34px">
  <header style="position: relative; flex-shrink: 0; margin: 0 -20px; background: #C4421D; color: #FFF6EE; border-radius: 0 0 36px 36px; padding: 56px 20px 24px; overflow: hidden">
  <svg aria-hidden="true" viewBox="0 0 390 300" width="390" height="300" style="position: absolute; left: 0; top: 0; opacity: 0.12">
      <circle cx="370" cy="30" r="96" fill="none" stroke="#FFF6EE" stroke-width="2"/>
      <circle cx="370" cy="30" r="64" fill="none" stroke="#FFF6EE" stroke-width="2"/>
    </svg>
  <div style="position: relative; display: flex; align-items: center; gap: 12px">
    <a href="Profile.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 246, 238, 0.16); color: #FFF6EE; display: flex; align-items: center; justify-content: center">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    </div>
  <div style="position: relative; display: flex; align-items: flex-end; margin-top: 4px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <h1 class="m-rise" style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 40px; line-height: 40px; font-weight: 800; letter-spacing: -1.5px; --d: 60ms">Settings</h1>
      <span class="m-note" style="font-family: Caveat, cursive; font-size: 21px; font-weight: 700; color: #FFE3C7; transform: rotate(-2deg); transform-origin: left center">make the kitchen yours</span>
    </div>
    <img class="m-pap" src="/_blob/395006def16e4f69026fd1869cbd727d" alt="" style="width: 92px; height: 92px; transform: rotate(6deg); margin: -20px -6px -12px 0">
  </div>
  </header>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
    <section style="display: flex; flex-direction: column">
      <h2 class="m-rise" style="margin: 28px 0 10px; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.3px; --d: 160ms">{{g.title}}</h2>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 4px 16px; box-shadow: 0 1px 2px rgba(60, 35, 20, 0.05)">
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
          <div style="border-bottom: {{r.rule}}">
            <sc-if value="{{r.isLink}}" hint-placeholder-val="{{true}}">
              <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0; box-sizing: border-box; text-decoration: none; color: #241C17">
                <span style="flex: 1; font-size: 15px; font-weight: 500">{{r.label}}</span>
                <span style="font-size: 14px; color: #6B5D54">{{r.value}}</span>
                <svg class="ico" style="width: 18px; height: 18px; color: #8A7B70" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
              </a>
            </sc-if>
            <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0; box-sizing: border-box">
                <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
                  <span style="font-size: 15px; font-weight: 500">{{r.label}}</span>
                  <span style="font-size: 13px; line-height: 18px; color: #6B5D54">{{r.sub}}</span>
                </span>
                <button role="switch" aria-checked="{{r.onStr}}" aria-label="{{r.label}}" style="width: 52px; height: 32px; border-radius: 16px; border: none; padding: 3px; display: flex; flex-shrink: 0; background: {{r.track}}; justify-content: {{r.knob}}">
                  <span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF"></span>
                </button>
              </div>
            </sc-if>
            <sc-if value="{{r.isSeg}}" hint-placeholder-val="{{false}}">
              <div role="radiogroup" aria-label="{{r.label}}" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0">
                <span style="font-size: 15px; font-weight: 500">{{r.label}}</span>
                <div style="display: flex; background: #F6F1EA; border-radius: 14px; padding: 4px; gap: 4px">
                  <sc-for list="{{r.options}}" as="o" hint-placeholder-count="2">
                    <button role="radio" aria-checked="{{o.onStr}}" style="flex: 1; height: 40px; border-radius: 11px; border: none; font-size: 14px; background: {{o.bg}}; color: {{o.fg}}; font-weight: {{o.weight}}">{{o.label}}</button>
                  </sc-for>
                </div>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>

  <button style="margin-top: 24px; height: 52px; border-radius: 18px; border: none; background: #FFFFFF; color: #241C17; font-size: 15px; font-weight: 600">Log out</button>
  <button style="margin-top: 8px; height: 48px; border: none; background: transparent; color: #A32A1A; font-size: 15px; font-weight: 600">Delete my account</button>
  <span style="margin-top: auto; text-align: center; font-size: 12px; color: #6B5D54">Deleting removes your recipes, likes and saves for good.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1720}}'>
class Component extends DCLogic {
  renderVals() {
    const base = { isLink: false, isToggle: false, isSeg: false, value: '', sub: '' };
    const link = (label, value) => ({ ...base, isLink: true, label, value: value || '' });
    const toggle = (label, sub, on) => ({
      ...base, isToggle: true, label, sub,
      onStr: on ? 'true' : 'false',
      track: on ? '#2F6B3A' : '#CDBFB4',
      knob: on ? 'flex-end' : 'flex-start'
    });
    const seg = (label, labels, picked) => ({
      ...base, isSeg: true, label,
      options: labels.map((l) => ({
        label: l,
        onStr: l === picked ? 'true' : 'false',
        bg: l === picked ? '#241C17' : 'transparent',
        fg: l === picked ? '#FFFFFF' : '#5E5048',
        weight: l === picked ? '700' : '600'
      }))
    });
    const group = (title, rows) => ({ title, rows: rows.map((r, i) => ({ ...r, rule: i < rows.length - 1 ? '1px solid #F1E8DF' : 'none' })) });
    return {
      groups: [
        group('Account', [
          link('Name and username', '@thandi.cooks'),
          link('Email', 'thandi@example.com'),
          link('Sign-in method', 'Google')
        ]),
        group('Cooking', [
          seg('Units', ['Metric', 'Imperial'], 'Metric'),
          link('Hide recipes with', 'Pork'),
          link('Currency', 'Rand (R)'),
          toggle('Keep screen on in cook mode', '', true)
        ]),
        group('Sharing', [
          link('New recipes are visible to', 'Friends'),
          toggle('Tell cooks when I make their recipe', 'They see "Thandi cooked your curry"', true)
        ]),
        group('Notifications', [
          toggle('Saves and cooks of my recipes', '', true),
          toggle('Friend requests', '', true),
          toggle('Weekly round-up', '', true),
          toggle('New recipes from friends', '', false)
        ]),
        group('Appearance', [
          seg('Theme', ['Light', 'Dark', 'Match phone'], 'Match phone')
        ]),
        group('About', [
          link('Help and feedback'),
          link('Privacy policy'),
          link('Terms')
        ])
      ]
    };
  }
}
</script>
</body>
</html>
