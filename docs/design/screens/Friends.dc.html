<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C4421D}a:hover{color:#8F2E12}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button,input{font:inherit}
button{cursor:pointer}
/* SharedPlates motion: one curve family, short durations */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.55,0,1,.45);--ease-back:cubic-bezier(.34,1.56,.64,1);--t-press:120ms;--t-small:200ms;--t-med:300ms;--t-large:450ms}
@keyframes m-rise{from{opacity:0;translate:0 14px}}
@keyframes m-print{from{opacity:0;translate:0 22px;rotate:-5deg}}
@keyframes m-pap{from{opacity:0;scale:.6;translate:0 14px}}
@keyframes m-note{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -6% -20% 0)}}
@keyframes m-stamp{from{opacity:0;scale:1.7}}
@keyframes m-sheet{from{translate:0 100%}}
@keyframes m-fade{from{opacity:0}}
@keyframes m-bump{35%{scale:1.3;color:#C4421D}}
@keyframes m-bump2{35%{scale:1.3;color:#C4421D}}
@keyframes m-flash{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-flash2{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes m-next{from{opacity:0;translate:32px 0}}
@keyframes m-next2{from{opacity:0;translate:32px 0}}
@keyframes m-back{from{opacity:0;translate:-32px 0}}
@keyframes m-back2{from{opacity:0;translate:-32px 0}}
.m-rise{animation:m-rise var(--t-large) var(--ease-out) backwards;animation-delay:var(--d,0ms)}
.m-print{animation:m-print 520ms var(--ease-out) backwards;animation-delay:var(--d,140ms);transition:translate var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),scale var(--t-press) var(--ease-out)}
a.m-print:hover,.m-lift:hover .m-print{translate:0 -4px;box-shadow:0 16px 30px rgba(60,35,20,.22)!important}
.m-pap{animation:m-pap 560ms var(--ease-back) backwards;animation-delay:var(--d,240ms)}
.m-note{animation:m-note 640ms var(--ease-out) backwards;animation-delay:var(--d,420ms)}
.m-stamp{animation:m-stamp 360ms var(--ease-back) backwards;animation-delay:var(--d,640ms)}
.m-sheet{animation:m-sheet var(--t-large) var(--ease-out) backwards;animation-delay:80ms}
.m-scrim{animation:m-fade var(--t-med) var(--ease-out) backwards}
.m-print:nth-child(1){--d:160ms}.m-print:nth-child(2){--d:230ms}.m-print:nth-child(3){--d:300ms}.m-print:nth-child(4){--d:370ms}.m-print:nth-child(5){--d:440ms}.m-print:nth-child(6){--d:510ms}
.m-tile:nth-child(1){--d:180ms}.m-tile:nth-child(2){--d:230ms}.m-tile:nth-child(3){--d:280ms}.m-tile:nth-child(4){--d:330ms}
.m-row:nth-child(1){--d:260ms}.m-row:nth-child(2){--d:310ms}.m-row:nth-child(3){--d:360ms}.m-row:nth-child(4){--d:410ms}.m-row:nth-child(5){--d:460ms}.m-row:nth-child(n+6){--d:500ms}
.m-tile img{transition:rotate var(--t-med) var(--ease-back),scale var(--t-med) var(--ease-back)}
.m-tile:hover img{rotate:12deg;scale:1.06}
button,a,label{transition:scale var(--t-press) var(--ease-out),background-color var(--t-small) var(--ease-out),color var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),border-color var(--t-small) var(--ease-out)}
button:active,a:active{scale:.97}
label:focus-within{box-shadow:0 0 0 3px rgba(233,162,59,.7),0 6px 16px rgba(80,25,8,.18)!important}
:focus-visible{outline:3px solid #E9A23B;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
/* end motion */
</style>
</helmet>
<div style="width: 390px; height: 1180px; box-sizing: border-box; background-color: #F6F1EA; background-image: radial-gradient(#E4D8CB 1.1px, transparent 1.3px); background-size: 20px 20px; font-family: Inter, system-ui, sans-serif; color: #241C17; position: relative; overflow: hidden">
  <header style="position: relative; background: #2F6B3A; color: #F3F8EE; border-radius: 0 0 40px 40px; padding: 56px 20px 24px; overflow: hidden">

      <circle cx="20" cy="30" r="90" fill="none" stroke="#F3F8EE" stroke-width="2"/>
      <circle cx="20" cy="30" r="60" fill="none" stroke="#F3F8EE" stroke-width="2"/>
      <circle cx="400" cy="260" r="70" fill="none" stroke="#F3F8EE" stroke-width="2"/>
    </svg>
    <div style="position: relative; display: flex; justify-content: flex-end">
      <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: #F3F8EE; color: #24552E; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px">
        <svg class="ico" style="width: 18px; height: 18px" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM3 20c.6-3.4 3.2-5.5 6.5-5.5S15.4 16.6 16 20M19 8v6M16 11h6"/></svg>

    </div>
    <div style="position: relative; display: flex; align-items: flex-end; margin-top: 4px; min-height: 96px">

        <h1 class="m-rise" style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 40px; line-height: 40px; font-weight: 800; letter-spacing: -1.5px; --d: 60ms">Friends</h1>
        <span class="m-note" style="font-family: Caveat, cursive; font-size: 21px; line-height: 20px; font-weight: 700; color: #DCEBCB; transform: rotate(-2deg); transform-origin: left center">12 kitchens and counting</span>
      </div>
      <img class="m-pap" src="/_blob/6a79ef128fe80f165db8235afce70eda" alt="Paprika" style="width: 104px; height: 104px; transform: rotate(-6deg); margin: 0 -6px -12px 0">
    </div>
    <label class="m-rise" for="f" style="position: relative; margin-top: 16px; height: 52px; border-radius: 26px; background: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 16px; color: #6B5D54; box-shadow: 0 6px 16px rgba(20, 50, 25, 0.2); --d: 140ms">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg>
      <input id="f" placeholder="Find people by name or @username" aria-label="Find people" style="flex: 1; border: none; background: transparent; font-size: 15px; color: #241C17; outline: none; min-width: 0">

  <div style="padding: 0 20px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 28px">

      <span style="min-width: 22px; height: 22px; border-radius: 11px; background: #C4421D; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px">
      <sc-for list="{{requests}}" as="p" hint-placeholder-count="2">
        <div style="background: #FFFFFF; border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(60, 35, 20, 0.05)">

            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
              <span style="font-size: 13px; color: #6B5D54">{{p.meta}}</span>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <button style="height: 44px; border-radius: 22px; border: none; background: #C4421D; color: #FFFFFF; font-size: 14px; font-weight: 700">Accept</button>
            <button style="height: 44px; border-radius: 22px; border: 1.5px solid #E2D6CA; background: #FFFFFF; color: #241C17; font-size: 14px; font-weight: 600">Not now</button>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 32px">
      <h2 class="m-rise" style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.4px; --d: 240ms">Just cooked</h2>
      <span class="m-note" style="font-family: Caveat, cursive; font-size: 19px; font-weight: 700; color: #8F2E12">fresh from their kitchens</span>
    </div>
    <div style="display: flex; gap: 16px; margin-top: 8px; margin-right: -20px; padding: 12px 0 8px 4px">

        <a class="m-print" href="Recipe-Detail.dc.html" style="position: relative; width: 136px; flex-shrink: 0; background: #FFFFFF; padding: 6px 6px 10px; box-sizing: border-box; border-radius: 5px; box-shadow: 0 6px 16px rgba(60, 35, 20, 0.12); text-decoration: none; color: #241C17; display: flex; flex-direction: column; gap: 4px; transform: rotate({{c.tilt}})">
          <span aria-hidden="true" style="position: absolute; top: -9px; left: 50%; width: 48px; height: 16px; margin-left: -24px; background: rgba(233, 162, 59, 0.55); transform: rotate({{c.tape}}); z-index: 1"></span>
          <img src="{{c.img}}" alt="" style="width: 100%; height: 100px; object-fit: cover; border-radius: 2px; display: block">
          <span class="m-note" style="padding: 2px 2px 0; font-family: Caveat, cursive; font-size: 19px; line-height: 18px; font-weight: 700">{{c.label}}</span>
        </a>
      </sc-for>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 24px">
      <h2 class="m-rise" style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.4px; --d: 320ms">Your friends · 12</h2>
      <span style="font-size: 13px; color: #6B5D54">Newest recipes first</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 24px; margin-top: 12px; padding: 4px 14px">
      <sc-for list="{{friends}}" as="p" hint-placeholder-count="4">
        <a href="Friend-Profile.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; text-decoration: none; color: #241C17; border-bottom: {{p.rule}}">
          <span style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; background: {{p.bg}}; color: {{p.fg}}">{{p.initials}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
            <span style="font-size: 13px; color: #6B5D54">{{p.handle}}</span>
          </span>
          <sc-if value="{{p.hasNew}}" hint-placeholder-val="{{true}}">
            <span style="border-radius: 999px; padding: 5px 10px; background: #E3EEDD; color: #24552E; font-size: 12px; font-weight: 700">{{p.newCount}}</span>
          </sc-if>
          <svg class="ico" style="width: 18px; height: 18px; color: #8A7B70" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; bottom: 0">
    <dc-import name="TabBar" active="friends" hint-size="390px,96px"></dc-import>
  </div>
</div>
</x-dc>
