<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Email sign-in · Code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C4421D}a:hover{color:#8F2E12}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button,input{font:inherit}
button{cursor:pointer}
/* SharedPlates motion: one curve family, short durations */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.55,0,1,.45);--ease-back:cubic-bezier(.34,1.56,.64,1);--t-press:120ms;--t-small:200ms;--t-med:300ms;--t-large:450ms}
@keyframes m-rise{from{opacity:0;translate:0 14px}}
@keyframes m-print{from{opacity:0;translate:0 22px;rotate:-5deg}}
@keyframes m-pap{from{opacity:0;scale:.6;translate:0 14px}}
@keyframes m-note{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -6% -20% 0)}}
@keyframes m-stamp{from{opacity:0;scale:1.7}}
@keyframes m-sheet{from{translate:0 100%}}
@keyframes m-fade{from{opacity:0}}
@keyframes m-bump{35%{scale:1.3;color:#C4421D}}
@keyframes m-bump2{35%{scale:1.3;color:#C4421D}}
@keyframes m-flash{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-flash2{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes m-next{from{opacity:0;translate:32px 0}}
@keyframes m-next2{from{opacity:0;translate:32px 0}}
@keyframes m-back{from{opacity:0;translate:-32px 0}}
@keyframes m-back2{from{opacity:0;translate:-32px 0}}
.m-rise{animation:m-rise var(--t-large) var(--ease-out) backwards;animation-delay:var(--d,0ms)}
.m-print{animation:m-print 520ms var(--ease-out) backwards;animation-delay:var(--d,140ms);transition:translate var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),scale var(--t-press) var(--ease-out)}
a.m-print:hover,.m-lift:hover .m-print{translate:0 -4px;box-shadow:0 16px 30px rgba(60,35,20,.22)!important}
.m-pap{animation:m-pap 560ms var(--ease-back) backwards;animation-delay:var(--d,240ms)}
.m-note{animation:m-note 640ms var(--ease-out) backwards;animation-delay:var(--d,420ms)}
.m-stamp{animation:m-stamp 360ms var(--ease-back) backwards;animation-delay:var(--d,640ms)}
.m-sheet{animation:m-sheet var(--t-large) var(--ease-out) backwards;animation-delay:80ms}
.m-scrim{animation:m-fade var(--t-med) var(--ease-out) backwards}
.m-print:nth-child(1){--d:160ms}.m-print:nth-child(2){--d:230ms}.m-print:nth-child(3){--d:300ms}.m-print:nth-child(4){--d:370ms}.m-print:nth-child(5){--d:440ms}.m-print:nth-child(6){--d:510ms}
.m-tile:nth-child(1){--d:180ms}.m-tile:nth-child(2){--d:230ms}.m-tile:nth-child(3){--d:280ms}.m-tile:nth-child(4){--d:330ms}
.m-row:nth-child(1){--d:260ms}.m-row:nth-child(2){--d:310ms}.m-row:nth-child(3){--d:360ms}.m-row:nth-child(4){--d:410ms}.m-row:nth-child(5){--d:460ms}.m-row:nth-child(n+6){--d:500ms}
.m-tile img{transition:rotate var(--t-med) var(--ease-back),scale var(--t-med) var(--ease-back)}
.m-tile:hover img{rotate:12deg;scale:1.06}
button,a,label{transition:scale var(--t-press) var(--ease-out),background-color var(--t-small) var(--ease-out),color var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),border-color var(--t-small) var(--ease-out)}
button:active,a:active{scale:.97}
label:focus-within{box-shadow:0 0 0 3px rgba(233,162,59,.7),0 6px 16px rgba(80,25,8,.18)!important}
:focus-visible{outline:3px solid #E9A23B;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
/* end motion */
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #F6F1EA; background-image: radial-gradient(#E4D8CB 1.1px, transparent 1.3px); background-size: 20px 20px; font-family: Inter, system-ui, sans-serif; color: #241C17; display: flex; flex-direction: column; padding: 0 24px 34px">
  <header style="position: relative; flex-shrink: 0; margin: 0 -24px; background: #C4421D; color: #FFF6EE; border-radius: 0 0 36px 36px; padding: 56px 24px 28px; overflow: hidden">
    <svg aria-hidden="true" viewBox="0 0 390 300" width="390" height="300" style="position: absolute; left: 0; top: 0; opacity: 0.12">
      <circle cx="370" cy="30" r="96" fill="none" stroke="#FFF6EE" stroke-width="2"/>
      <circle cx="370" cy="30" r="64" fill="none" stroke="#FFF6EE" stroke-width="2"/>
    </svg>
    <a href="Main.dc.html" aria-label="Back" style="position: relative; width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 246, 238, 0.16); color: #FFF6EE; display: flex; align-items: center; justify-content: center">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <img class="m-pap" src="/_blob/fd05c3b3ed07ba9f787fd29eb349f1ae" alt="" style="position: absolute; right: 14px; top: 70px; width: 120px; height: 120px; transform: rotate(6deg)">
    <span class="m-note" style="position: absolute; right: 22px; top: 186px; font-family: Caveat, cursive; font-size: 20px; font-weight: 700; color: #FFE3C7; transform: rotate(-4deg)">I'll wait here...</span>
    <h1 class="m-rise" style="position: relative; margin: 72px 0 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 40px; line-height: 40px; font-weight: 800; letter-spacing: -1.5px; max-width: 220px; --d: 60ms">Check your email</h1>
    <p style="position: relative; margin: 12px 0 0; font-size: 16px; line-height: 24px; color: #FFE3C7">We sent a 6-digit code to <span style="font-weight: 700; color: #FFF6EE">thandi@example.com</span>. <a href="#" style="font-weight: 700; color: #FFF6EE">Change</a></p>
  </header>

  <fieldset style="border: none; margin: 28px 0 0; padding: 0">
    <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 12px">Your code</legend>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
        <input aria-label="{{d.label}}" value="{{d.value}}" inputmode="numeric" autocomplete="one-time-code" maxlength="1" style="height: 60px; border-radius: 14px; border: none; background: #FFFFFF; box-shadow: {{d.ring}}; text-align: center; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 26px; font-weight: 700; color: #241C17; outline: none; min-width: 0; padding: 0">
      </sc-for>
    </div>
  </fieldset>
  <p style="margin: 16px 0 0; font-size: 14px; color: #6B5D54">Didn't get it? You can resend in 0:42.</p>

  <div style="margin-top: 24px; background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; gap: 12px; align-items: flex-start">
    <svg class="ico" style="color: #2F6B3A; margin-top: 1px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6zM9 12l2.5 2.5L15.5 10"/></svg>
    <span style="font-size: 14px; line-height: 20px; color: #5E5048">No password to remember. The code signs you in, or sets up your account if you're new.</span>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <button disabled style="height: 56px; border-radius: 28px; border: none; background: #EBDDD2; color: #6B5D54; font-size: 16px; font-weight: 700; cursor: default">Enter all 6 digits</button>
    <button style="height: 52px; border-radius: 26px; border: none; background: #FFFFFF; color: #241C17; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg class="ico" style="width: 20px; height: 20px" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg>
      Open my mail app
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const typed = ['4', '8', '2'];
    const idle = '0 0 0 1px #EBE2D8, 0 1px 2px rgba(60, 35, 20, 0.06)';
    return {
      digits: [0, 1, 2, 3, 4, 5].map((i) => ({
        label: 'Digit ' + (i + 1) + ' of 6',
        value: typed[i] || '',
        ring: i === typed.length ? 'inset 0 0 0 2px #C4421D' : idle
      }))
    };
  }
}
</script>
</body>
</html>
