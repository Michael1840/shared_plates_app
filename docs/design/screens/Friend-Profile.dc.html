<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A friend's profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C4421D}a:hover{color:#8F2E12}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font:inherit;cursor:pointer}
/* SharedPlates motion: one curve family, short durations */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.55,0,1,.45);--ease-back:cubic-bezier(.34,1.56,.64,1);--t-press:120ms;--t-small:200ms;--t-med:300ms;--t-large:450ms}
@keyframes m-rise{from{opacity:0;translate:0 14px}}
@keyframes m-print{from{opacity:0;translate:0 22px;rotate:-5deg}}
@keyframes m-pap{from{opacity:0;scale:.6;translate:0 14px}}
@keyframes m-note{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -6% -20% 0)}}
@keyframes m-stamp{from{opacity:0;scale:1.7}}
@keyframes m-sheet{from{translate:0 100%}}
@keyframes m-fade{from{opacity:0}}
@keyframes m-bump{35%{scale:1.3;color:#C4421D}}
@keyframes m-bump2{35%{scale:1.3;color:#C4421D}}
@keyframes m-flash{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-flash2{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes m-next{from{opacity:0;translate:32px 0}}
@keyframes m-next2{from{opacity:0;translate:32px 0}}
@keyframes m-back{from{opacity:0;translate:-32px 0}}
@keyframes m-back2{from{opacity:0;translate:-32px 0}}
.m-rise{animation:m-rise var(--t-large) var(--ease-out) backwards;animation-delay:var(--d,0ms)}
.m-print{animation:m-print 520ms var(--ease-out) backwards;animation-delay:var(--d,140ms);transition:translate var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),scale var(--t-press) var(--ease-out)}
a.m-print:hover,.m-lift:hover .m-print{translate:0 -4px;box-shadow:0 16px 30px rgba(60,35,20,.22)!important}
.m-pap{animation:m-pap 560ms var(--ease-back) backwards;animation-delay:var(--d,240ms)}
.m-note{animation:m-note 640ms var(--ease-out) backwards;animation-delay:var(--d,420ms)}
.m-stamp{animation:m-stamp 360ms var(--ease-back) backwards;animation-delay:var(--d,640ms)}
.m-sheet{animation:m-sheet var(--t-large) var(--ease-out) backwards;animation-delay:80ms}
.m-scrim{animation:m-fade var(--t-med) var(--ease-out) backwards}
.m-print:nth-child(1){--d:160ms}.m-print:nth-child(2){--d:230ms}.m-print:nth-child(3){--d:300ms}.m-print:nth-child(4){--d:370ms}.m-print:nth-child(5){--d:440ms}.m-print:nth-child(6){--d:510ms}
.m-tile:nth-child(1){--d:180ms}.m-tile:nth-child(2){--d:230ms}.m-tile:nth-child(3){--d:280ms}.m-tile:nth-child(4){--d:330ms}
.m-row:nth-child(1){--d:260ms}.m-row:nth-child(2){--d:310ms}.m-row:nth-child(3){--d:360ms}.m-row:nth-child(4){--d:410ms}.m-row:nth-child(5){--d:460ms}.m-row:nth-child(n+6){--d:500ms}
.m-tile img{transition:rotate var(--t-med) var(--ease-back),scale var(--t-med) var(--ease-back)}
.m-tile:hover img{rotate:12deg;scale:1.06}
button,a,label{transition:scale var(--t-press) var(--ease-out),background-color var(--t-small) var(--ease-out),color var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),border-color var(--t-small) var(--ease-out)}
button:active,a:active{scale:.97}
label:focus-within{box-shadow:0 0 0 3px rgba(233,162,59,.7),0 6px 16px rgba(80,25,8,.18)!important}
:focus-visible{outline:3px solid #E9A23B;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
/* end motion */
</style>
</helmet>
<div style="width: 390px; height: 960px; box-sizing: border-box; background-color: #F6F1EA; background-image: radial-gradient(#E4D8CB 1.1px, transparent 1.3px); background-size: 20px 20px; font-family: Inter, system-ui, sans-serif; color: #241C17; position: relative; overflow: hidden">

  <header style="position: relative; background: #2F6B3A; color: #F3F8EE; border-radius: 0 0 40px 40px; padding: 56px 20px 56px; overflow: hidden">
    <svg aria-hidden="true" viewBox="0 0 390 300" width="390" height="300" style="position: absolute; left: 0; top: 0; opacity: 0.12">
      <circle cx="370" cy="40" r="96" fill="none" stroke="#F3F8EE" stroke-width="2"/>
      <circle cx="370" cy="40" r="64" fill="none" stroke="#F3F8EE" stroke-width="2"/>
    </svg>
    <div style="position: relative; display: flex; align-items: center; gap: 8px">
      <a href="Friends.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(243, 248, 238, 0.16); color: #F3F8EE; display: flex; align-items: center; justify-content: center">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <span style="flex: 1"></span>
      <button aria-label="More: remove friend, report, block" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(243, 248, 238, 0.16); color: #F3F8EE; display: flex; align-items: center; justify-content: center">
        <svg class="ico" style="stroke-width: 3" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h.01M12 12h.01M18 12h.01"/></svg>
      </button>
    </div>
    <div style="position: relative; display: flex; align-items: center; gap: 16px; margin-top: 12px">
      <span style="width: 84px; height: 84px; border-radius: 50%; background: #F3F8EE; color: #24552E; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 800; font-size: 30px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 0 0 4px rgba(243, 248, 238, 0.3)">LM</span>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <h1 class="m-rise" style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 30px; line-height: 32px; font-weight: 800; letter-spacing: -0.8px; --d: 60ms">Lerato Mokoena</h1>
        <span style="font-size: 14px; opacity: 0.9">@lerato.eats · Durban</span>
      </div>
    </div>
    <p class="m-note" style="position: relative; margin: 12px 0 0; font-family: Caveat, cursive; font-size: 22px; line-height: 22px; font-weight: 700; color: #DCEBCB; transform: rotate(-1.5deg); transform-origin: left center">Cape Malay classics on a budget</p>
  </header>

  <div style="padding: 0 20px; display: flex; flex-direction: column">
    <div style="position: relative; margin-top: -32px; background: #FFFFFF; border-radius: 24px; padding: 12px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 24px rgba(60, 35, 20, 0.12)">
      <span aria-hidden="true" style="display: flex; flex-shrink: 0">
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #F9E3D8; color: #8F2E12; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF">AP</span>
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #DCE2EE; color: #2F4064; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF; margin-left: -8px">JK</span>
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #F6D6DA; color: #7A2A3D; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF; margin-left: -8px">NS</span>
      </span>
      <span style="flex: 1; font-size: 13px; line-height: 18px; color: #5E5048">Aisha, Jared and 2 more friends in common</span>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 12px">
      <button aria-pressed="true" style="flex: 1; height: 48px; border-radius: 24px; border: none; background: #E3EEDD; color: #24552E; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg class="ico" style="width: 18px; height: 18px; stroke-width: 2.4" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Friends
      </button>
      <button aria-label="Share Lerato's profile" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: #FFFFFF; box-shadow: 0 0 0 1px #EBE2D8; color: #241C17; display: flex; align-items: center; justify-content: center">
        <svg class="ico" style="width: 20px; height: 20px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>
      </button>
    </div>

    <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 24px">
      <h2 class="m-rise" style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.4px; --d: 160ms">48 recipes</h2>
      <span class="m-note" style="font-family: Caveat, cursive; font-size: 19px; font-weight: 700; color: #8F2E12">saved 1.2k times!</span>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 12px; margin-right: -20px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button aria-pressed="{{c.pressed}}" style="height: 40px; padding: 0 14px; border-radius: 12px; border: none; font-size: 14px; white-space: nowrap; flex-shrink: 0; background: {{c.bg}}; color: {{c.fg}}; box-shadow: {{c.ring}}; font-weight: {{c.weight}}">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px; row-gap: 20px; margin-top: 20px; padding: 0 2px">
      <sc-for list="{{cards}}" as="r" hint-placeholder-count="4">
        <a class="m-print" href="Recipe-Detail.dc.html" style="position: relative; background: #FFFFFF; padding: 6px 6px 10px; border-radius: 5px; box-shadow: 0 6px 16px rgba(60, 35, 20, 0.12); display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #241C17; transform: rotate({{r.tilt}})">
          <span aria-hidden="true" style="position: absolute; top: -9px; left: 50%; width: 52px; height: 16px; margin-left: -26px; background: rgba(233, 162, 59, 0.55); transform: rotate({{r.tape}}); z-index: 1; display: {{r.tapeShow}}"></span>
          <img src="{{r.img}}" alt="" style="width: 100%; height: 116px; object-fit: cover; border-radius: 2px; display: block">
          <span style="padding: 2px 2px 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 15px; line-height: 18px; font-weight: 700">{{r.title}}</span>
          <span style="padding: 0 2px; font-size: 12px; color: #6B5D54">{{r.meta}}</span>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = ['All', 'Curries', 'Budget', 'Baking', 'Sunday lunch'];
    return {
      chips: labels.map((label, i) => ({
        label,
        pressed: i === 0 ? 'true' : 'false',
        bg: i === 0 ? '#F9E3D8' : '#FFFFFF',
        fg: i === 0 ? '#7A2710' : '#241C17',
        ring: i === 0 ? 'inset 0 0 0 1.5px #C4421D' : '0 0 0 1px #EBE2D8, 0 1px 2px rgba(60, 35, 20, 0.06)',
        weight: i === 0 ? '700' : '500'
      })),
      cards: [
        { title: 'Cape Malay chicken curry', meta: 'R37 a plate · 284 likes', tilt: '-1.4deg', tape: '-4deg', tapeShow: 'block', img: '/_blob/bba34ca874bd0e3b4ba3d543557bb0c7' },
        { title: 'Mom’s bobotie', meta: 'R24 a plate · 512 likes', tilt: '1.2deg', tape: '0deg', tapeShow: 'none', img: '/_blob/986769dc2e2026ecfeb3f823e092b0d3' },
        { title: 'Butter bean curry', meta: 'R18 a plate · 208 likes', tilt: '1deg', tape: '0deg', tapeShow: 'none', img: '/_blob/092e1419e10d9850ee07d8049da5b7af' },
        { title: 'Malva pudding', meta: 'R12 a plate · 331 likes', tilt: '-1.2deg', tape: '3deg', tapeShow: 'block', img: '/_blob/2363ba8a9310ccaa16e3f20ef7080999' }
      ]
    };
  }
}
</script>
</body>
</html>
