<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C4421D}a:hover{color:#8F2E12}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button,input{font:inherit}
button{cursor:pointer}
/* SharedPlates motion: one curve family, short durations */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.55,0,1,.45);--ease-back:cubic-bezier(.34,1.56,.64,1);--t-press:120ms;--t-small:200ms;--t-med:300ms;--t-large:450ms}
@keyframes m-rise{from{opacity:0;translate:0 14px}}
@keyframes m-print{from{opacity:0;translate:0 22px;rotate:-5deg}}
@keyframes m-pap{from{opacity:0;scale:.6;translate:0 14px}}
@keyframes m-note{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -6% -20% 0)}}
@keyframes m-stamp{from{opacity:0;scale:1.7}}
@keyframes m-sheet{from{translate:0 100%}}
@keyframes m-fade{from{opacity:0}}
@keyframes m-bump{35%{scale:1.3;color:#C4421D}}
@keyframes m-bump2{35%{scale:1.3;color:#C4421D}}
@keyframes m-flash{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-flash2{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes m-next{from{opacity:0;translate:32px 0}}
@keyframes m-next2{from{opacity:0;translate:32px 0}}
@keyframes m-back{from{opacity:0;translate:-32px 0}}
@keyframes m-back2{from{opacity:0;translate:-32px 0}}
.m-rise{animation:m-rise var(--t-large) var(--ease-out) backwards;animation-delay:var(--d,0ms)}
.m-print{animation:m-print 520ms var(--ease-out) backwards;animation-delay:var(--d,140ms);transition:translate var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),scale var(--t-press) var(--ease-out)}
a.m-print:hover,.m-lift:hover .m-print{translate:0 -4px;box-shadow:0 16px 30px rgba(60,35,20,.22)!important}
.m-pap{animation:m-pap 560ms var(--ease-back) backwards;animation-delay:var(--d,240ms)}
.m-note{animation:m-note 640ms var(--ease-out) backwards;animation-delay:var(--d,420ms)}
.m-stamp{animation:m-stamp 360ms var(--ease-back) backwards;animation-delay:var(--d,640ms)}
.m-sheet{animation:m-sheet var(--t-large) var(--ease-out) backwards;animation-delay:80ms}
.m-scrim{animation:m-fade var(--t-med) var(--ease-out) backwards}
.m-print:nth-child(1){--d:160ms}.m-print:nth-child(2){--d:230ms}.m-print:nth-child(3){--d:300ms}.m-print:nth-child(4){--d:370ms}.m-print:nth-child(5){--d:440ms}.m-print:nth-child(6){--d:510ms}
.m-tile:nth-child(1){--d:180ms}.m-tile:nth-child(2){--d:230ms}.m-tile:nth-child(3){--d:280ms}.m-tile:nth-child(4){--d:330ms}
.m-row:nth-child(1){--d:260ms}.m-row:nth-child(2){--d:310ms}.m-row:nth-child(3){--d:360ms}.m-row:nth-child(4){--d:410ms}.m-row:nth-child(5){--d:460ms}.m-row:nth-child(n+6){--d:500ms}
.m-tile img{transition:rotate var(--t-med) var(--ease-back),scale var(--t-med) var(--ease-back)}
.m-tile:hover img{rotate:12deg;scale:1.06}
button,a,label{transition:scale var(--t-press) var(--ease-out),background-color var(--t-small) var(--ease-out),color var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),border-color var(--t-small) var(--ease-out)}
button:active,a:active{scale:.97}
label:focus-within{box-shadow:0 0 0 3px rgba(233,162,59,.7),0 6px 16px rgba(80,25,8,.18)!important}
:focus-visible{outline:3px solid #E9A23B;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
/* end motion */
</style>
</helmet>

  <div style="display: flex; flex-direction: column; gap: 10px">
