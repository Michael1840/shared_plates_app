<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cook mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F7B79B}a:hover{color:#FFFFFF}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font:inherit;cursor:pointer}
@keyframes tick{0%,100%{opacity:1}50%{opacity:.55}}
.tick{animation:tick 1s steps(2) infinite}
/* SharedPlates motion: one curve family, short durations */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.55,0,1,.45);--ease-back:cubic-bezier(.34,1.56,.64,1);--t-press:120ms;--t-small:200ms;--t-med:300ms;--t-large:450ms}
@keyframes m-rise{from{opacity:0;translate:0 14px}}
@keyframes m-print{from{opacity:0;translate:0 22px;rotate:-5deg}}
@keyframes m-pap{from{opacity:0;scale:.6;translate:0 14px}}
@keyframes m-note{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -6% -20% 0)}}
@keyframes m-stamp{from{opacity:0;scale:1.7}}
@keyframes m-sheet{from{translate:0 100%}}
@keyframes m-fade{from{opacity:0}}
@keyframes m-bump{35%{scale:1.3;color:#C4421D}}
@keyframes m-bump2{35%{scale:1.3;color:#C4421D}}
@keyframes m-flash{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-flash2{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes m-next{from{opacity:0;translate:32px 0}}
@keyframes m-next2{from{opacity:0;translate:32px 0}}
@keyframes m-back{from{opacity:0;translate:-32px 0}}
@keyframes m-back2{from{opacity:0;translate:-32px 0}}
.m-rise{animation:m-rise var(--t-large) var(--ease-out) backwards;animation-delay:var(--d,0ms)}
.m-print{animation:m-print 520ms var(--ease-out) backwards;animation-delay:var(--d,140ms);transition:translate var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),scale var(--t-press) var(--ease-out)}
a.m-print:hover,.m-lift:hover .m-print{translate:0 -4px;box-shadow:0 16px 30px rgba(60,35,20,.22)!important}
.m-pap{animation:m-pap 560ms var(--ease-back) backwards;animation-delay:var(--d,240ms)}
.m-note{animation:m-note 640ms var(--ease-out) backwards;animation-delay:var(--d,420ms)}
.m-stamp{animation:m-stamp 360ms var(--ease-back) backwards;animation-delay:var(--d,640ms)}
.m-sheet{animation:m-sheet var(--t-large) var(--ease-out) backwards;animation-delay:80ms}
.m-scrim{animation:m-fade var(--t-med) var(--ease-out) backwards}
.m-print:nth-child(1){--d:160ms}.m-print:nth-child(2){--d:230ms}.m-print:nth-child(3){--d:300ms}.m-print:nth-child(4){--d:370ms}.m-print:nth-child(5){--d:440ms}.m-print:nth-child(6){--d:510ms}
.m-tile:nth-child(1){--d:180ms}.m-tile:nth-child(2){--d:230ms}.m-tile:nth-child(3){--d:280ms}.m-tile:nth-child(4){--d:330ms}
.m-row:nth-child(1){--d:260ms}.m-row:nth-child(2){--d:310ms}.m-row:nth-child(3){--d:360ms}.m-row:nth-child(4){--d:410ms}.m-row:nth-child(5){--d:460ms}.m-row:nth-child(n+6){--d:500ms}
.m-tile img{transition:rotate var(--t-med) var(--ease-back),scale var(--t-med) var(--ease-back)}
.m-tile:hover img{rotate:12deg;scale:1.06}
button,a,label{transition:scale var(--t-press) var(--ease-out),background-color var(--t-small) var(--ease-out),color var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),border-color var(--t-small) var(--ease-out)}
button:active,a:active{scale:.97}
label:focus-within{box-shadow:0 0 0 3px rgba(233,162,59,.7),0 6px 16px rgba(80,25,8,.18)!important}
:focus-visible{outline:3px solid #E9A23B;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
/* end motion */
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #1C1613; background-image: radial-gradient(#2E2520 1.1px, transparent 1.3px); background-size: 20px 20px; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 54px 20px 34px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Recipe-Detail.dc.html" aria-label="Leave cook mode" style="width: 44px; height: 44px; border-radius: 50%; background: #3A2F28; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </a>
    <div style="flex: 1; text-align: center; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; font-weight: 700">Step {{stepNo}} of 6</span>
      <span style="font-size: 12px; color: #CDBFB4">Cape Malay chicken curry · 4 servings</span>
    </div>
    <button aria-label="Show all ingredients" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #3A2F28; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; margin-top: 16px">
    <sc-for list="{{segments}}" as="g" hint-placeholder-count="6">
      <span style="height: 5px; border-radius: 3px; background: {{g.bg}}; transition: background-color 300ms cubic-bezier(.22,1,.36,1)"></span>
    </sc-for>
  </div>

  <span style="align-self: center; margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: #CDBFB4">
    <svg class="ico" style="width: 14px; height: 14px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    Screen stays on while you cook
  </span>

  <div class="{{stepAnim}}" style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px; animation-duration: 300ms; animation-timing-function: cubic-bezier(.22,1,.36,1)">
    <div style="display: flex; align-items: flex-end; gap: 12px">
      <span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 72px; line-height: 64px; font-weight: 800; color: #F08A63">{{stepNo}}</span>
      <span class="m-note" style="flex: 1; font-family: Caveat, cursive; font-size: 22px; font-weight: 700; color: #F7B79B; transform: rotate(-3deg); margin-bottom: 6px">you've got this</span>
      <img class="m-pap" src="/_blob/f402df697933c300ec103155ec0ee4eb" alt="" style="width: 76px; height: 76px; transform: rotate(6deg); margin-bottom: -6px">
    </div>
    <p aria-live="polite" style="margin: 0; font-size: 26px; line-height: 36px; font-weight: 500; letter-spacing: -0.2px"><sc-for list="{{parts}}" as="p" hint-placeholder-count="3"><span style="{{p.style}}">{{p.t}}</span></sc-for></p>

    <sc-if value="{{hasNeeds}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; color: #CDBFB4">You'll need</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{needs}}" as="n" hint-placeholder-count="2">
            <span style="border-radius: 999px; padding: 8px 14px; background: #3A2F28; font-size: 15px; font-weight: 600">{{n}}</span>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{hasTimer}}" hint-placeholder-val="{{true}}">
      <button onClick="{{toggleTimer}}" style="height: 64px; border-radius: 32px; border: none; display: flex; align-items: center; gap: 12px; padding: 0 18px; background: {{timerBg}}; color: #241C17">
        <svg class="ico" style="width: 26px; height: 26px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM12 9v4M10 2.5h4"/></svg>
        <span style="flex: 1; text-align: left; font-size: 18px; font-weight: 700"><span class="{{timerClass}}">{{timerText}}</span></span>
        <span style="font-size: 14px; font-weight: 700">{{timerAction}}</span>
      </button>
    </sc-if>
  </div>

  <span style="text-align: center; font-size: 12px; color: #CDBFB4; margin-bottom: 10px">Messy hands? Swipe, or tap either side of the screen.</span>
  <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 12px">
    <button onClick="{{back}}" aria-label="Previous step" style="height: 64px; border-radius: 32px; border: none; background: #3A2F28; color: {{backFg}}; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Back
    </button>
    <sc-if value="{{notLast}}" hint-placeholder-val="{{true}}">
      <button onClick="{{next}}" style="height: 64px; border-radius: 32px; border: none; background: #C4421D; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
        Next step
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </sc-if>
    <sc-if value="{{isLast}}" hint-placeholder-val="{{false}}">
      <a href="Cook-Done.dc.html" style="height: 64px; border-radius: 32px; background: #2F6B3A; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        I'm done!
      </a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0, running: false, nav: 0, dir: 'next' };
  }
  renderVals() {
    const { step, running, nav, dir } = this.state;
    const hi = (t) => ({ t, style: 'color: #F7B79B; font-weight: 700' });
    const tx = (t) => ({ t, style: '' });
    const steps = [
      { parts: [tx('Heat '), hi('30 ml oil'), tx(' in a large pot. Add the '), hi('2 onions'), tx(' and cook until soft and golden.')], needs: ['30 ml sunflower oil', '2 onions, sliced'], timer: 8 },
      { parts: [tx('Stir in the '), hi('garlic'), tx(', '), hi('ginger'), tx(', '), hi('curry powder'), tx(' and '), hi('turmeric'), tx('. Fry until fragrant.')], needs: ['4 garlic cloves', '15 g ginger', '2 tbsp curry powder', '1 tsp turmeric'], timer: 1 },
      { parts: [tx('Add the '), hi('chicken'), tx(' and turn to coat in the spices. Brown on all sides.')], needs: ['1 kg chicken thighs'], timer: 5 },
      { parts: [tx('Pour in the '), hi('tomatoes'), tx(' and '), hi('stock'), tx('. Bring to a simmer, cover and cook.')], needs: ['400 g chopped tomatoes', '250 ml chicken stock'], timer: 20 },
      { parts: [tx('Add the '), hi('potatoes'), tx(' and simmer uncovered until tender.')], needs: ['500 g potatoes'], timer: 15 },
      { parts: [tx('Season with salt, scatter over the '), hi('coriander'), tx(' and serve with rice or roti.')], needs: ['1 bunch coriander', 'Salt'], timer: 0 }
    ];
    const s = steps[step];
    const last = step === steps.length - 1;
    return {
      stepNo: step + 1,
      stepAnim: nav === 0 ? '' : (dir === 'next' ? (nav % 2 ? 'm-next' : 'm-next2') : (nav % 2 ? 'm-back' : 'm-back2')),
      parts: s.parts,
      needs: s.needs,
      hasNeeds: s.needs.length > 0,
      hasTimer: s.timer > 0,
      timerText: running ? (s.timer - 1) + ':59 left' : 'Start ' + s.timer + ' min timer',
      timerAction: running ? 'Pause' : 'Go',
      timerClass: running ? 'tick' : '',
      timerBg: running ? '#F5E1B5' : '#E9A23B',
      toggleTimer: () => this.setState({ running: !running }),
      segments: steps.map((x, i) => ({ bg: i <= step ? '#F08A63' : '#4A3E36' })),
      notLast: !last,
      isLast: last,
      backFg: step === 0 ? '#8A7B70' : '#FFFFFF',
      back: () => step > 0 && this.setState({ step: step - 1, running: false, nav: nav + 1, dir: 'back' }),
      next: () => step < steps.length - 1 && this.setState({ step: step + 1, running: false, nav: nav + 1, dir: 'next' })
    };
  }
}
</script>
</body>
</html>
