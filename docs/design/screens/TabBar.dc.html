<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
/* SharedPlates motion: one curve family, short durations */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.55,0,1,.45);--ease-back:cubic-bezier(.34,1.56,.64,1);--t-press:120ms;--t-small:200ms;--t-med:300ms;--t-large:450ms}
@keyframes m-rise{from{opacity:0;translate:0 14px}}
@keyframes m-print{from{opacity:0;translate:0 22px;rotate:-5deg}}
@keyframes m-pap{from{opacity:0;scale:.6;translate:0 14px}}
@keyframes m-note{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -6% -20% 0)}}
@keyframes m-stamp{from{opacity:0;scale:1.7}}
@keyframes m-sheet{from{translate:0 100%}}
@keyframes m-fade{from{opacity:0}}
@keyframes m-bump{35%{scale:1.3;color:#C4421D}}
@keyframes m-bump2{35%{scale:1.3;color:#C4421D}}
@keyframes m-flash{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-flash2{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes m-next{from{opacity:0;translate:32px 0}}
@keyframes m-next2{from{opacity:0;translate:32px 0}}
@keyframes m-back{from{opacity:0;translate:-32px 0}}
@keyframes m-back2{from{opacity:0;translate:-32px 0}}
.m-rise{animation:m-rise var(--t-large) var(--ease-out) backwards;animation-delay:var(--d,0ms)}
.m-print{animation:m-print 520ms var(--ease-out) backwards;animation-delay:var(--d,140ms);transition:translate var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),scale var(--t-press) var(--ease-out)}
a.m-print:hover,.m-lift:hover .m-print{translate:0 -4px;box-shadow:0 16px 30px rgba(60,35,20,.22)!important}
.m-pap{animation:m-pap 560ms var(--ease-back) backwards;animation-delay:var(--d,240ms)}
.m-note{animation:m-note 640ms var(--ease-out) backwards;animation-delay:var(--d,420ms)}
.m-stamp{animation:m-stamp 360ms var(--ease-back) backwards;animation-delay:var(--d,640ms)}
.m-sheet{animation:m-sheet var(--t-large) var(--ease-out) backwards;animation-delay:80ms}
.m-scrim{animation:m-fade var(--t-med) var(--ease-out) backwards}
.m-print:nth-child(1){--d:160ms}.m-print:nth-child(2){--d:230ms}.m-print:nth-child(3){--d:300ms}.m-print:nth-child(4){--d:370ms}.m-print:nth-child(5){--d:440ms}.m-print:nth-child(6){--d:510ms}
.m-tile:nth-child(1){--d:180ms}.m-tile:nth-child(2){--d:230ms}.m-tile:nth-child(3){--d:280ms}.m-tile:nth-child(4){--d:330ms}
.m-row:nth-child(1){--d:260ms}.m-row:nth-child(2){--d:310ms}.m-row:nth-child(3){--d:360ms}.m-row:nth-child(4){--d:410ms}.m-row:nth-child(5){--d:460ms}.m-row:nth-child(n+6){--d:500ms}
.m-tile img{transition:rotate var(--t-med) var(--ease-back),scale var(--t-med) var(--ease-back)}
.m-tile:hover img{rotate:12deg;scale:1.06}
button,a,label{transition:scale var(--t-press) var(--ease-out),background-color var(--t-small) var(--ease-out),color var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),border-color var(--t-small) var(--ease-out)}
button:active,a:active{scale:.97}
label:focus-within{box-shadow:0 0 0 3px rgba(233,162,59,.7),0 6px 16px rgba(80,25,8,.18)!important}
:focus-visible{outline:3px solid #E9A23B;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
@keyframes m-tabpop{from{scale:.6;opacity:.4}}
a[aria-current="page"] svg{animation:m-tabpop 380ms var(--ease-back) backwards 120ms}
a[aria-label="Create a recipe"] svg{transition:rotate var(--t-med) var(--ease-back)}
a[aria-label="Create a recipe"]:hover svg{rotate:90deg}
/* end motion */
</style>
</helmet>
<nav aria-label="Main" style="width: 390px; height: 96px; box-sizing: border-box; padding: 8px 16px 22px; font-family: Inter, system-ui, sans-serif">
  <div style="height: 66px; box-sizing: border-box; border-radius: 33px; padding: 0 8px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: {{bg}}; box-shadow: {{shadow}}; backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5)">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="5">
      <sc-if value="{{item.isCreate}}" hint-placeholder-val="{{false}}">
        <a href="{{item.href}}" aria-label="Create a recipe" style="justify-self: center; width: 50px; height: 50px; border-radius: 50%; background: #C4421D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(196, 66, 29, 0.35)">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </a>
      </sc-if>
      <sc-if value="{{item.isTab}}" hint-placeholder-val="{{true}}">
        <a href="{{item.href}}" aria-current="{{item.current}}" style="height: 50px; border-radius: 25px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{item.color}}; background: {{item.pill}}">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"/></svg>
          <span style="font-size: 11px; line-height: 13px; font-weight: {{item.weight}}">{{item.label}}</span>
        </a>
      </sc-if>
    </sc-for>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","discover","recipes","friends"],"default":"home"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const dark = (this.props.theme ?? 'light') === 'dark';
    const c = dark
      ? { bg: 'rgba(52, 42, 35, 0.88)', shadow: '0 10px 30px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.07)', on: '#F7B79B', off: '#B5A69A', pill: '#4A2A1E' }
      : { bg: 'rgba(255, 255, 255, 0.88)', shadow: '0 10px 30px rgba(60, 35, 20, 0.16), inset 0 0 0 1px rgba(60, 35, 20, 0.05)', on: '#A8391A', off: '#6B5D54', pill: '#F9E3D8' };
    const tabs = [
      { id: 'home', label: 'Home', href: 'Home.dc.html', d: 'M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z' },
      { id: 'discover', label: 'Discover', href: 'Discover.dc.html', d: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM15.5 8.5l-2 5-5 2 2-5z' },
      { id: 'create', label: 'Create', href: 'Create-Start.dc.html' },
      { id: 'recipes', label: 'Recipes', href: 'Recipes.dc.html', d: 'M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3M9 7.5h6' },
      { id: 'friends', label: 'Friends', href: 'Friends.dc.html', d: 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5M16 4.3a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.7.7 2.8 2.5 3 5.2' }
    ];
    return {
      bg: c.bg,
      shadow: c.shadow,
      items: tabs.map((t) => ({
        ...t,
        isCreate: t.id === 'create',
        isTab: t.id !== 'create',
        current: t.id === active ? 'page' : 'false',
        color: t.id === active ? c.on : c.off,
        pill: t.id === active ? c.pill : 'transparent',
        weight: t.id === active ? '700' : '500'
      }))
    };
  }
}
</script>
</body>
</html>
