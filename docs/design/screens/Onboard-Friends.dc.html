<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C4421D}a:hover{color:#8F2E12}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button,input{font:inherit}
button{cursor:pointer}
/* SharedPlates motion: one curve family, short durations */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.55,0,1,.45);--ease-back:cubic-bezier(.34,1.56,.64,1);--t-press:120ms;--t-small:200ms;--t-med:300ms;--t-large:450ms}
@keyframes m-rise{from{opacity:0;translate:0 14px}}
@keyframes m-print{from{opacity:0;translate:0 22px;rotate:-5deg}}
@keyframes m-pap{from{opacity:0;scale:.6;translate:0 14px}}
@keyframes m-note{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -6% -20% 0)}}
@keyframes m-stamp{from{opacity:0;scale:1.7}}
@keyframes m-sheet{from{translate:0 100%}}
@keyframes m-fade{from{opacity:0}}
@keyframes m-bump{35%{scale:1.3;color:#C4421D}}
@keyframes m-bump2{35%{scale:1.3;color:#C4421D}}
@keyframes m-flash{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-flash2{from{background-color:rgba(233,162,59,.5)}to{background-color:rgba(233,162,59,0)}}
@keyframes m-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes m-next{from{opacity:0;translate:32px 0}}
@keyframes m-next2{from{opacity:0;translate:32px 0}}
@keyframes m-back{from{opacity:0;translate:-32px 0}}
@keyframes m-back2{from{opacity:0;translate:-32px 0}}
.m-rise{animation:m-rise var(--t-large) var(--ease-out) backwards;animation-delay:var(--d,0ms)}
.m-print{animation:m-print 520ms var(--ease-out) backwards;animation-delay:var(--d,140ms);transition:translate var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),scale var(--t-press) var(--ease-out)}
a.m-print:hover,.m-lift:hover .m-print{translate:0 -4px;box-shadow:0 16px 30px rgba(60,35,20,.22)!important}
.m-pap{animation:m-pap 560ms var(--ease-back) backwards;animation-delay:var(--d,240ms)}
.m-note{animation:m-note 640ms var(--ease-out) backwards;animation-delay:var(--d,420ms)}
.m-stamp{animation:m-stamp 360ms var(--ease-back) backwards;animation-delay:var(--d,640ms)}
.m-sheet{animation:m-sheet var(--t-large) var(--ease-out) backwards;animation-delay:80ms}
.m-scrim{animation:m-fade var(--t-med) var(--ease-out) backwards}
.m-print:nth-child(1){--d:160ms}.m-print:nth-child(2){--d:230ms}.m-print:nth-child(3){--d:300ms}.m-print:nth-child(4){--d:370ms}.m-print:nth-child(5){--d:440ms}.m-print:nth-child(6){--d:510ms}
.m-tile:nth-child(1){--d:180ms}.m-tile:nth-child(2){--d:230ms}.m-tile:nth-child(3){--d:280ms}.m-tile:nth-child(4){--d:330ms}
.m-row:nth-child(1){--d:260ms}.m-row:nth-child(2){--d:310ms}.m-row:nth-child(3){--d:360ms}.m-row:nth-child(4){--d:410ms}.m-row:nth-child(5){--d:460ms}.m-row:nth-child(n+6){--d:500ms}
.m-tile img{transition:rotate var(--t-med) var(--ease-back),scale var(--t-med) var(--ease-back)}
.m-tile:hover img{rotate:12deg;scale:1.06}
button,a,label{transition:scale var(--t-press) var(--ease-out),background-color var(--t-small) var(--ease-out),color var(--t-small) var(--ease-out),box-shadow var(--t-small) var(--ease-out),border-color var(--t-small) var(--ease-out)}
button:active,a:active{scale:.97}
label:focus-within{box-shadow:0 0 0 3px rgba(233,162,59,.7),0 6px 16px rgba(80,25,8,.18)!important}
:focus-visible{outline:3px solid #E9A23B;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
/* end motion */
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #F6F1EA; background-image: radial-gradient(#E4D8CB 1.1px, transparent 1.3px); background-size: 20px 20px; font-family: Inter, system-ui, sans-serif; color: #241C17; display: flex; flex-direction: column; padding: 0 20px 34px">

      <circle cx="370" cy="30" r="64" fill="none" stroke="#FFF6EE" stroke-width="2"/>
    </svg>
  <div style="position: relative; display: flex; align-items: center; gap: 12px">
    <a href="Onboard-Taste.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 246, 238, 0.16); color: #FFF6EE; display: flex; align-items: center; justify-content: center">

    <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">

        <span style="height: 6px; border-radius: 3px; background: #FFF6EE"></span>
        <span style="height: 6px; border-radius: 3px; background: #FFF6EE"></span>
        <span style="height: 6px; border-radius: 3px; background: #FFF6EE"></span>
      </div>
      <span style="font-size: 12px; color: #FFE3C7">Last step</span>
    </div>
    <a href="Home-FirstRun.dc.html" style="font-size: 15px; font-weight: 600; color: #FFF6EE; text-decoration: none; padding: 12px 4px">Skip</a>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 12px; margin-top: 18px; position: relative">
    <img class="m-pap" src="/_blob/395006def16e4f69026fd1869cbd727d" alt="Paprika" style="width: 92px; height: 92px; margin: 0 -6px -14px -8px; flex-shrink: 0">
    <div style="background: #FFFFFF; color: #241C17; border-radius: 22px 22px 22px 6px; box-shadow: 0 6px 16px rgba(80, 25, 8, 0.18); padding: 12px 16px; font-size: 15px; line-height: 22px; margin-bottom: 10px">Cooking's better with company. Want to bring your people along?</div>

  <div style="margin-top: 24px; background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px">

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button style="height: 48px; border-radius: 14px; border: none; background: #241C17; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg class="ico" style="width: 20px; height: 20px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>
        Share
      </button>
      <button style="height: 48px; border-radius: 14px; border: 1.5px solid #E2D6CA; background: #FFFFFF; color: #241C17; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg class="ico" style="width: 20px; height: 20px" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        Copy link
      </button>
    </div>
  </div>

  <label class="m-rise" for="find" style="margin-top: 16px; height: 52px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #E2D6CA; display: flex; align-items: center; gap: 12px; padding: 0 14px; color: #6B5D54; --d: 140ms">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg>
    <input id="find" placeholder="Find by name or @username" aria-label="Find by name or username" style="flex: 1; border: none; background: transparent; font-size: 15px; color: #241C17; outline: none; min-width: 0">
  </label>

  <h2 class="m-rise" style="margin: 24px 0 12px; font-size: 14px; font-weight: 600; --d: 160ms">Popular cooks for your tastes</h2>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border-radius: 18px; padding: 12px; display: flex; align-items: center; gap: 12px">
        <span style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; background: {{p.bg}}; color: {{p.fg}}">{{p.initials}}</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
          <span style="font-size: 13px; color: #6B5D54">{{p.meta}}</span>
        </div>
        <sc-if value="{{p.requested}}" hint-placeholder-val="{{false}}">
          <button style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #E2D6CA; background: #FFFFFF; color: #5E5048; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px">

            Requested
          </button>
        </sc-if>
        <sc-if value="{{p.notRequested}}" hint-placeholder-val="{{true}}">
          <button style="height: 40px; padding: 0 18px; border-radius: 12px; border: none; background: #F9E3D8; color: #8F2E12; font-size: 14px; font-weight: 700">Add</button>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <a href="Home-FirstRun.dc.html" style="margin-top: auto; height: 56px; border-radius: 28px; background: #C4421D; box-shadow: 0 8px 18px rgba(196, 66, 29, 0.28); color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Start cooking</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

    const people = [

      { initials: 'RV', name: 'Riaan van Wyk', meta: 'Braai master · 31 recipes', bg: '#F5E1B5', fg: '#6B430B', requested: false },

  }
}
</script>
